<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.45">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="24" fill="url(#glow1)" />
  <rect width="1200" height="380" rx="24" fill="url(#glow2)" />
  <rect x="1" y="1" width="1198" height="378" rx="23" stroke="#334155" stroke-opacity="0.5" stroke-width="2" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
  </g>

  <!-- Left Content: Brand Badge & Title -->
  <g transform="translate(72, 54)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="286" height="32" rx="16" fill="#1E293B" stroke="#4F46E5" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#818CF8" />
    <text x="32" y="21" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AURANIX TECHNOLOGIES</text>

    <!-- Logo Mark + Title -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#brandGrad)" />
      <text x="38" y="51" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="-1.5">AO</text>
      <circle cx="60" cy="18" r="4" fill="#C7D2FE" />

      <text x="96" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" letter-spacing="-1.5">AuraOffice</text>
      <text x="98" y="76" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" font-style="italic">One Workspace. Endless Possibilities.</text>
    </g>

    <!-- Description -->
    <text x="0" y="168" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      An AI-powered productivity ecosystem uniting documents, spreadsheets, presentations,
    </text>
    <text x="0" y="192" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      relational databases, notes, mail, forms, graphic design, PDF tools, and cloud drive.
    </text>

    <!-- Suite App Pills -->
    <g transform="translate(0, 224)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="92" height="30" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.6" />
      <text x="46" y="19" text-anchor="middle" fill="#93C5FD">AuraWrite</text>

      <rect x="102" y="0" width="96" height="30" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.6" />
      <text x="150" y="19" text-anchor="middle" fill="#6EE7B7">AuraSheets</text>

      <rect x="208" y="0" width="92" height="30" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" />
      <text x="254" y="19" text-anchor="middle" fill="#FCD34D">AuraSlides</text>

      <rect x="310" y="0" width="110" height="30" rx="8" fill="#1E293B" stroke="#EF4444" stroke-opacity="0.6" />
      <text x="365" y="19" text-anchor="middle" fill="#FCA5A5">AuraDatabase</text>

      <rect x="430" y="0" width="92" height="30" rx="8" fill="#1E293B" stroke="#A855F7" stroke-opacity="0.6" />
      <text x="476" y="19" text-anchor="middle" fill="#D8B4FE">AuraNotes</text>

      <rect x="532" y="0" width="84" height="30" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-opacity="0.6" />
      <text x="574" y="19" text-anchor="middle" fill="#7DD3FC">AuraMail</text>

      <rect x="626" y="0" width="90" height="30" rx="8" fill="#1E293B" stroke="#14B8A6" stroke-opacity="0.6" />
      <text x="671" y="19" text-anchor="middle" fill="#5EEAD4">AuraForms</text>

      <rect x="726" y="0" width="96" height="30" rx="8" fill="#1E293B" stroke="#EC4899" stroke-opacity="0.6" />
      <text x="774" y="19" text-anchor="middle" fill="#F9A8D4">AuraDesign</text>

      <rect x="832" y="0" width="82" height="30" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-opacity="0.6" />
      <text x="873" y="19" text-anchor="middle" fill="#FDA4AF">AuraPDF</text>

      <rect x="924" y="0" width="98" height="30" rx="8" fill="#312E81" stroke="#818CF8" stroke-opacity="0.8" />
      <text x="973" y="19" text-anchor="middle" fill="#E0E7FF">✨ Aura AI</text>
    </g>
  </g>
</svg>
